[tool:pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=85 --strict-markers"
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
asyncio_mode = auto

