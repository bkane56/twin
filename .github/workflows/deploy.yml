name: Deploy Digital Twin

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Verify authorized GitHub actor
        run: |
          case "${{ github.actor }}" in
            bkane56)
              echo "Authorized actor: ${{ github.actor }}"
              ;;
            *)
              echo "Unauthorized actor: ${{ github.actor }}"
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run deployment script
        run: |
          export AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export DEFAULT_AWS_REGION="${{ secrets.DEFAULT_AWS_REGION }}"
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "${{ github.event.inputs.environment }}"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Get deployment outputs
        id: deploy_outputs
        working-directory: ./terraform
        run: |
          terraform workspace select "${{ github.event.inputs.environment }}"
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw s3_frontend_bucket)" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront
        run: |
          FRONTEND_BUCKET="${{ steps.deploy_outputs.outputs.frontend_bucket }}"
          REGION="${{ secrets.DEFAULT_AWS_REGION }}"
          ORIGIN_DOMAIN="${FRONTEND_BUCKET}.s3-website-${REGION}.amazonaws.com"

          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${ORIGIN_DOMAIN}']].Id | [0]" \
            --output text)

          if [ "$DISTRIBUTION_ID" != "None" ] && [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          else
            echo "No CloudFront distribution found for origin: ${ORIGIN_DOMAIN}"
          fi

      - name: Deployment summary
        run: |
          echo "Deployment complete."
          echo "CloudFront URL: ${{ steps.deploy_outputs.outputs.cloudfront_url }}"
          echo "API Gateway: ${{ steps.deploy_outputs.outputs.api_url }}"
          echo "Frontend Bucket: ${{ steps.deploy_outputs.outputs.frontend_bucket }}"
