name: Deploy Digital Twin

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "prod2"
        type: choice
        options:
          - dev
          - test
          - prod
          - prod2

permissions:
  id-token: write
  contents: read

concurrency:
  group: twin-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Verify authorized GitHub actor
        run: |
          case "${{ github.actor }}" in
            bkane56)
              echo "Authorized actor: ${{ github.actor }}"
              ;;
            *)
              echo "Unauthorized actor: ${{ github.actor }}"
              echo "Only approved GitHub users should be allowed to deploy this public repository."
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-twin-deploy-${{ github.event.inputs.environment }}
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Run deployment script
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEFAULT_AWS_REGION: ${{ secrets.DEFAULT_AWS_REGION }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "${{ github.event.inputs.environment }}"

      - name: Deployment summary
        working-directory: ./terraform
        run: |
          terraform workspace select "${{ github.event.inputs.environment }}"
          echo "Deployment complete."
          echo "CloudFront URL: $(terraform output -raw cloudfront_url)"
          echo "API Gateway: $(terraform output -raw api_gateway_url)"
          echo "Frontend Bucket: $(terraform output -raw s3_frontend_bucket)"
          echo "CloudFront Distribution ID: $(terraform output -raw cloudfront_distribution_id)"
          echo "Custom domain: not managed by this repo. brianekane.com is reserved for the personal website."
