name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
          - prod2
      confirm:
        description: "Type DESTROY to confirm destruction"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: destroy

    steps:
      - name: Verify authorized GitHub actor
        run: |
          case "${{ github.actor }}" in
            bkane56)
              echo "Authorized actor: ${{ github.actor }}"
              ;;
            *)
              echo "Unauthorized actor: ${{ github.actor }}"
              exit 1
              ;;
          esac

      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation failed. You must type DESTROY."
            exit 1
          fi
          echo "Destruction confirmed for ${{ github.event.inputs.environment }}."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-destroy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run destroy script
        run: |
          export AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export DEFAULT_AWS_REGION="${{ secrets.DEFAULT_AWS_REGION }}"
          chmod +x scripts/destroy.sh
          ./scripts/destroy.sh "${{ github.event.inputs.environment }}"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Destruction complete
        run: |
          echo "Environment ${{ github.event.inputs.environment }} has been destroyed."
